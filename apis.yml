aid: glia-fka-salemove
name: Glia (fka SaleMove)
description: >-
  Glia (formerly SaleMove) is a digital customer service and unified interaction
  management platform purpose-built for banks, credit unions, and other financial
  institutions. Its ChannelLess platform combines voice AI, digital self-service,
  live chat and messaging, co-browsing, secure video, and workforce analytics into
  a single engagement stack so frontline agents can move across channels within one
  conversation. Glia also ships Glia Functions — a serverless JavaScript platform
  (workerd runtime) similar to AWS Lambda or Cloudflare Workers — plus first-party
  iOS, Android, and web SDKs for embedding customer service into apps, and a REST
  API (api.glia.com) with a bearer-token authentication model. Developer tooling
  includes the Glia Functions CLI and an embedded Model Context Protocol (MCP)
  server that exposes 23 tools for AI assistants to manage functions.
