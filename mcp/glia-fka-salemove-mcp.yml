server:
  name: glia-functions-cli
  transport: stdio
  launch: glia-functions mcp
  runtime: node
  description: First-party MCP (Model Context Protocol) server shipped inside the Glia Functions CLI (github.com/salemove/glia-functions-tools).
    Lets AI assistants like Claude manage Glia Functions — create/deploy/invoke serverless JavaScript
    functions, view logs, operate the KV store, and manage scheduled triggers — over STDIO transport.
    Requires a Glia Site ID, API Key and Secret.
